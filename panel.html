<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel · Invitados y canciones</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Great+Vibes&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#fff,#efe3f7 70%);color:#3a2563;font-family:Montserrat,Arial,sans-serif}
main{max-width:980px;margin:0 auto;padding:36px 16px 60px}
h1{font:400 clamp(44px,9vw,64px) 'Great Vibes',cursive;color:#5b3a8c;text-align:center;margin:0 0 6px}
.sub{text-align:center;font:500 20px 'Cormorant Garamond',serif;margin:0 0 26px}
.box{background:#ffffffcc;border:1px solid #d8c7e5;border-radius:16px;padding:22px;box-shadow:0 10px 30px #5b3a8c1a}
#login{max-width:420px;margin:30px auto;text-align:center}
button{border:0;border-radius:40px;padding:13px 26px;font:500 12px Montserrat,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;background:linear-gradient(180deg,#7656a5,#5b3a8c);color:#fff}
button.line{background:transparent;color:#5b3a8c;border:2px solid #5b3a8c}
.tabs{display:flex;gap:10px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}.tabs button{background:transparent;color:#5b3a8c;border:2px solid #5b3a8c}.tabs button.on{background:#5b3a8c;color:#fff}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th{font:600 11px Montserrat;letter-spacing:.08em;text-transform:uppercase;text-align:left;color:#7a6a8c;padding:10px 12px;border-bottom:2px solid #d8c7e5;white-space:nowrap}
td{padding:12px;border-bottom:1px solid #eadff3;vertical-align:top}td.n{font:600 18px 'Cormorant Garamond',serif;color:#5b3a8c}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;background:#e6f3e6;color:#2f6b25;white-space:nowrap}.tag.no{background:#f3e6e6;color:#8a3a3a}
ol{list-style:none;margin:0;padding:0;counter-reset:s}li{counter-increment:s;display:flex;gap:14px;align-items:baseline;padding:13px 4px;border-bottom:1px solid #eadff3;font:500 21px 'Cormorant Garamond',serif}
li::before{content:counter(s);min-width:34px;height:34px;border-radius:50%;background:#5b3a8c;color:#fff;display:grid;place-items:center;font:600 14px Montserrat}
li small{margin-left:auto;font:400 11px Montserrat;color:#7a6a8c;white-space:nowrap}
.empty{text-align:center;color:#7a6a8c;padding:24px}#msg{color:#8a3a3a;font-size:13px;margin-top:14px}
.top{text-align:center;margin-top:26px}[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Panel de la fiesta</h1>
  <p class="sub">Invitados y canciones de sugerencia</p>

  <div id="login" class="box">
    <p>Ingresá con tu cuenta de Google para ver las respuestas.</p>
    <button id="in" type="button">Ingresar con Google</button>
    <p id="msg"></p>
  </div>

  <div id="app" hidden>
    <div class="tabs">
      <button class="on" id="tG" type="button">Invitados</button>
      <button id="tS" type="button">Canciones de sugerencia</button>
    </div>
    <div class="box" id="pG"><div class="wrap"><table>
      <thead><tr><th>#</th><th>Nombre</th><th>Teléfono</th><th>Asistencia</th><th>Personas</th><th>Mensaje</th><th>Fecha</th></tr></thead>
      <tbody id="rows"></tbody></table></div><p class="empty" id="eG" hidden>Todavía no hay confirmaciones.</p></div>
    <div class="box" id="pS" hidden><ol id="songs"></ol><p class="empty" id="eS" hidden>Todavía no hay sugerencias.</p></div>
    <p class="top"><button class="line" id="out" type="button">Salir</button></p>
  </div>
</main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, query, orderBy, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const app = initializeApp({
  apiKey: 'AIzaSyBB9klQ5vfcydkqWXdt9zQo13EZK1Av1hM',
  authDomain: 'yaz-26d2b.firebaseapp.com',
  projectId: 'yaz-26d2b',
  appId: '1:146769007163:web:975c9a980adfa54293821e'
});
const auth = getAuth(app), db = getFirestore(app);
const $ = (id) => document.getElementById(id);
const fmt = (ts) => ts && ts.toDate ? ts.toDate().toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' }) : '';
const cell = (tr, text, cls) => { const td = document.createElement('td'); td.textContent = text || ''; if (cls) td.className = cls; tr.append(td); return td; };
let unsub = [];

$('in').onclick = () => { $('msg').textContent = ''; signInWithPopup(auth, new GoogleAuthProvider()).catch(() => { $('msg').textContent = 'No se pudo ingresar. Probá de nuevo.'; }); };
$('out').onclick = () => signOut(auth);
const show = (g) => { $('pG').hidden = !g; $('pS').hidden = g; $('tG').classList.toggle('on', g); $('tS').classList.toggle('on', !g); };
$('tG').onclick = () => show(true); $('tS').onclick = () => show(false);
const denied = () => { $('msg').textContent = 'Esta cuenta no tiene permiso para ver el panel.'; signOut(auth); };

onAuthStateChanged(auth, (user) => {
  unsub.forEach((u) => u()); unsub = [];
  $('login').hidden = !!user; $('app').hidden = !user;
  if (!user) return;

  unsub.push(onSnapshot(query(collection(db, 'confirmaciones'), orderBy('creado')), (snap) => {
    const rows = $('rows'); rows.replaceChildren();
    snap.docs.forEach((d, i) => {
      const x = d.data(), tr = document.createElement('tr');
      cell(tr, String(i + 1), 'n'); cell(tr, x.nombre); cell(tr, x.telefono);
      const a = cell(tr, ''); const t = document.createElement('span'); const no = /no podr/i.test(x.asistencia || '');
      t.className = 'tag' + (no ? ' no' : ''); t.textContent = no ? 'No asiste' : 'Asiste'; a.append(t);
      cell(tr, x.cantidad); cell(tr, x.mensaje); cell(tr, fmt(x.creado));
      rows.append(tr);
    });
    $('eG').hidden = snap.size > 0; $('tG').textContent = `Invitados (${snap.size})`;
  }, denied));

  unsub.push(onSnapshot(query(collection(db, 'canciones'), orderBy('creado')), (snap) => {
    const ol = $('songs'); ol.replaceChildren();
    snap.docs.forEach((d) => {
      const x = d.data(), li = document.createElement('li');
      li.append(document.createTextNode(x.cancion || ''));
      const s = document.createElement('small'); s.textContent = fmt(x.creado); li.append(s); ol.append(li);
    });
    $('eS').hidden = snap.size > 0; $('tS').textContent = `Canciones de sugerencia (${snap.size})`;
  }, denied));
});
</script>
</body>
</html>
